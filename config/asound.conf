# Clanker ALSA mix — safe as sole ALSA_CONFIG_PATH
pcm.clanker_hw {
    type hw
    card 0
    device 0
}
pcm.clanker_dmix {
    type dmix
    ipc_key 424242
    ipc_perm 0666
    slave {
        pcm "clanker_hw"
        format S32_LE
        rate 44100
        channels 2
        period_size 1024
        buffer_size 8192
    }
}
pcm.clanker {
    type plug
    slave.pcm "clanker_dmix"
}
pcm.clanker_quiet {
    type route
    slave.pcm "clanker"
    ttable.0.0 0.6
    ttable.1.1 0.6
}
pcm.!default {
    type plug
    slave.pcm "clanker_dmix"
}
ctl.!default {
    type hw
    card 0
}
