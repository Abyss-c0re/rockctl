# Clanker ALSA mix — safe as sole ALSA_CONFIG_PATH (does not rely on system conf).
# Use: ALSA_CONFIG_PATH=/mnt/data/rockctl/asound.conf aplay -D clanker file.wav

pcm.clanker_hw {
    type hw
    card 0
    device 0
}

pcm.clanker_dmix {
    type dmix
    ipc_key 424242
    ipc_perm 0666
    slave {
        pcm "clanker_hw"
        format S32_LE
        rate 44100
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.clanker {
    type plug
    slave.pcm "clanker_dmix"
}

# Keep default usable when this file is the only config
pcm.!default {
    type plug
    slave.pcm "clanker_dmix"
}

ctl.!default {
    type hw
    card 0
}

# Allow explicit hw:0,0 style via our names only; apps should use clanker.
pcm.hw0 {
    type hw
    card 0
    device 0
}
